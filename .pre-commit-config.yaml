repos:
  # Built-in fast hooks (zero setup, Rust-native)
  - repo: builtin
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude: ^gui/frontend/wailsjs/
      - id: end-of-file-fixer
        exclude: ^gui/frontend/wailsjs/
      - id: check-yaml
      - id: check-json
      - id: check-toml
