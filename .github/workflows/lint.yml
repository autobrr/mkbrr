name: Lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint CLI and GUI modules
        run: make -k lint

  gui-bindings:
    name: GUI bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: |
            go.sum
            gui/go.sum
          cache: true

      - name: Install Wails CLI
        run: make install-wails

      - name: Generate GUI bindings
        run: make gui-bindings

      - name: Check that the bindings are committed
        run: |
          if [ -n "$(git status --porcelain -- gui/frontend/wailsjs)" ]; then
            git status --short -- gui/frontend/wailsjs
            git diff -- gui/frontend/wailsjs
            echo "::error::The GUI bindings in gui/frontend/wailsjs are out of date. Run 'make gui-bindings' and commit the regenerated files."
            exit 1
          fi
