version: "2"

issues:
  max-same-issues: 0

formatters:
  enable:
    - goimports
    - gofmt

  settings:
    goimports:
      local-prefixes:
        - github.com/autobrr/mkbrr

linters:
  enable:
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - gocritic
    - gosec
    - mirror
    - misspell
    - noctx
    - perfsprint
    - prealloc
    - revive
    - testifylint
    - unconvert
    - whitespace

  settings:
    exhaustive:
      # A switch with a default has handled the rest by definition.
      default-signifies-exhaustive: true

    gocritic:
      disabled-checks:
        # Taste, not correctness.
        - ifElseChain

    gosec:
      excludes:
        - G115

    # The GUI create preview must show the create plan, and the GUI must not
    # build an output filename itself, so that it matches what create writes.
    # The exclusion rules below limit these guards to gui/, because torrent/
    # walks folders and decides the output path itself, and limit the
    # .torrent writer guard to torrent/ code outside tests. The preset guard
    # keeps raw preset reads in the preset package, the preset loader, and the
    # modify code, so that the create resolver holds each preset rule.
    forbidigo:
      # Without analyze-types, a rule that has pkg matches nothing.
      analyze-types: true
      forbid:
        - pattern: ^torrent\.(GetRecommendedPieceLengthExp|AnalyzeSeasonPackFromPath)$
          pkg: ^github\.com/autobrr/mkbrr/torrent$
          msg: use the create plan (torrent.PlanCreate, through the GUI App.PlanCreate method), so the GUI matches the torrent that create writes
        - pattern: ^filepath\.(Walk|WalkDir)$
          pkg: ^path/filepath$
          msg: do not scan the content folder in the GUI; use the create plan (torrent.PlanCreate, through the GUI App.PlanCreate method)
        - pattern: ^preset\.(GetDomainPrefix|GenerateOutputPath)$
          pkg: ^github\.com/autobrr/mkbrr/internal/preset$
          msg: the torrent package decides the output path; read it from the create plan or the create result
        - pattern: ^os\.(Create|CreateTemp|WriteFile)$
          pkg: ^os$
          msg: write a .torrent file with writeTorrentOutput (torrent/write.go), so a failed write keeps the old file
        - pattern: ^(preset\.(Load|LoadPresetValues)|\*?preset\.Config\.PresetValues)$
          pkg: ^github\.com/autobrr/mkbrr/internal/preset$
          msg: load a create preset with the preset loader (createpreset.Load), so the create resolver holds each preset rule

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # The create plan guard applies only to GUI code.
      - path-except: ^gui/
        linters:
          - forbidigo
        text: "create plan|output path"

      - path-except: ^torrent/
        linters:
          - forbidigo
        text: writeTorrentOutput
      - path: _test\.go
        linters:
          - forbidigo
        text: writeTorrentOutput

      - path: ^(internal/(preset|createpreset)/|torrent/modify\.go$)
        linters:
          - forbidigo
        text: preset loader

      # A parameter an interface forces on an implementation still documents
      # what the caller passes; renaming it to _ loses that.
      - linters:
          - revive
        text: "unused-parameter"

      # Renaming a type to drop the package name is a wide rename through
      # every caller for a naming preference.
      - linters:
          - revive
        text: "stutters"

      # BitTorrent v1 piece hashes are SHA-1 by spec (BEP 3).
      - path: torrent/(hasher|verify)\.go
        linters:
          - gosec
        text: "G401|G505"

      # Test fixtures may build requests without a context and hold obvious
      # fake credentials.
      - path: _test\.go
        linters:
          - gosec
          - noctx
